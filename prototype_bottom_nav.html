    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* 프로토타입 컨테이너 */
        .proto-container {
            max-width: 430px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
        }

        /* 헤더 영역 (미리보기용) */
        .proto-header {
            background: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .proto-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .proto-logo img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }
        .proto-logo span {
            font-weight: 800;
            font-size: 20px;
            color: #1E3A8A;
        }

        /* 더미 콘텐츠 */
        .dummy-content {
            padding: 20px 16px;
        }
        .dummy-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #1e40af 100%);
            border-radius: 16px;
            padding: 24px;
            color: white;
            margin-bottom: 16px;
        }
        .dummy-card h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .dummy-card p {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .dummy-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: white;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
            margin-bottom: 16px;
        }
        .dummy-grid-item {
            text-align: center;
            padding: 8px 4px;
        }
        .dummy-grid-item .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 4px;
            font-size: 1.2rem;
        }
        .dummy-grid-item span {
            font-size: 0.72rem;
            font-weight: 600;
            color: #475569;
        }
        .dummy-search {
            background: white;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #f1f5f9;
            margin-bottom: 16px;
        }
        .dummy-search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .dummy-search-btn {
            width: 100%;
            padding: 10px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .dummy-prices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .dummy-price-card {
            background: white;
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
        }
        .dummy-price-card .model {
            font-size: 0.8rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 4px;
        }
        .dummy-price-card .price {
            font-size: 0.85rem;
            font-weight: 800;
            color: #dc2626;
        }

        /* ============================================ */
        /* 개선안 프로토타입 섹션 제목 */
        /* ============================================ */
        .section-label {
            text-align: center;
            padding: 40px 20px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .section-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .section-desc {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* ============================================ */
        /* 최종 개선안: 5-item balanced bottom nav    */
        /* ============================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 72px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 0 8px;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 9999;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none !important;
            flex: 1;
            height: 100%;
            padding-top: 8px;
            color: #94a3b8;
            transition: color 0.2s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item i {
            font-size: 1.4rem;
            margin-bottom: 3px;
            transition: transform 0.2s ease;
        }

        .nav-item span {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        /* 활성 상태 */
        .nav-item.active {
            color: #1E3A8A;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: #2563EB;
            border-radius: 0 0 4px 4px;
        }

        /* 호버/터치 피드백 */
        .nav-item:active {
            transform: scale(0.92);
        }

        /* ===== 중앙 판매하기 CTA 버튼 ===== */
        .nav-item.sell-cta {
            position: relative;
            top: -18px;
            flex: none;
            width: 72px;
            height: auto;
            padding-top: 0;
            color: #1e293b;
        }

        .nav-item.sell-cta .sell-icon-wrap {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 
                0 4px 15px rgba(37, 99, 235, 0.4),
                0 0 0 0 rgba(37, 99, 235, 0.4);
            animation: sellPulse 2.5s ease-in-out infinite;
            transition: transform 0.2s ease;
        }

        .nav-item.sell-cta .sell-icon-wrap i {
            font-size: 1.6rem;
            color: white;
            margin: 0;
        }

        .nav-item.sell-cta span {
            margin-top: 5px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #2563EB;
        }

        .nav-item.sell-cta:active .sell-icon-wrap {
            transform: scale(0.9);
        }

        .nav-item.sell-cta::before {
            display: none;
        }

        @keyframes sellPulse {
            0% { box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4), 0 0 0 0 rgba(37, 99, 235, 0.35); }
            50% { box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4), 0 0 0 10px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4), 0 0 0 0 rgba(37, 99, 235, 0); }
        }

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ko',
                includedLanguages: 'ko,en,zh-CN,ja,vi,ru'
            }, 'google_translate_element');
        }

        document.addEventListener('DOMContentLoaded', function() {
            var customSelect = document.getElementById('custom_lang_select');
            if (!customSelect) return;
            
            // Initial load cookie check
            var match = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
            if (match) {
                var lang = match[1].split('/').pop();
                if (lang && lang !== 'ko') {
                    customSelect.value = lang;
                }
            } else {
                customSelect.value = 'ko';
            }

            customSelect.addEventListener('change', function() {
                var targetLang = this.value;
                
                if (targetLang === 'ko') {
                    // Force cookie clear and reload to perfectly restore original Korean DOM
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + window.location.hostname + '; path=/;';
                    window.location.reload();
                    return;
                }

                var gtSelect = document.querySelector('.goog-te-combo');
                if (gtSelect) {
                    gtSelect.value = targetLang;
                    gtSelect.dispatchEvent(new Event('change'));
                }
                
                document.cookie = 'googtrans=/ko/' + targetLang + '; path=/';
                document.cookie = 'googtrans=/ko/' + targetLang + '; domain=' + window.location.hostname + '; path=/';
                
                // Small delay to allow the Google Translate script to catch the change, else reload
                setTimeout(() => {
                    if(!document.querySelector('.goog-te-combo')) {
                        window.location.reload();
                    }
                }, 300);
            });
            
            // Mutation observer to force remove body top styling injected dynamically by google translate
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.attributeName === 'style') {
                        if (document.body.style.top) {
                            document.body.style.top = '';
                        }
                    }
                });
            });
            observer.observe(document.body, { attributes: true });
        });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
