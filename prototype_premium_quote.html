    <style>
        :root {
            --primary: #2563EB;

        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Mock */
        nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .nav-logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px;}
        .logo-circle { width: 32px; height: 32px; background: var(--primary); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;}

        /* --- Main Two-Column Layout (Responsive) --- */
        .layout-container {
            display: flex;
            flex-direction: row; /* Desktop: side by side */
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 40px;
            gap: 40px;
        }

        /* Left Side: Showcase Area */
        .showcase-area {
            flex: 1;
            background: linear-gradient(135deg, #E0E7FF 0%, #DBEAFE 100%);
            border-radius: 30px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: sticky;
            top: 100px; /* Sticks to top when scrolling */
            height: calc(100vh - 140px);
            overflow: hidden;
            box-shadow: inset 0 0 100px rgba(255,255,255,0.5);
        }

        .showcase-badge {
            display: inline-block;
            background: white;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .showcase-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            color: #1E3A8A;
            margin-bottom: 16px;
        }

        .showcase-subtitle {
            font-size: 1.1rem;
            color: #3B82F6;
            margin-bottom: 40px;
            max-width: 80%;
        }

        /* Showcase Image */
        .showcase-image-container {
            position: relative;
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }


        /* Right Side: Interaction Area */
        .interaction-area {
            flex: 1;
            padding: 20px 0;
            max-width: 600px;
        }

        .step-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .step-desc {
            color: var(--text-sub);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .option-card {
            background: white;
            border: 2px solid #E0E0E0;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: #E3F2FD;
        }

        .option-icon {
            display: block;
            margin: 0 auto 15px;
            height: 60px;
            width: auto;
        }

        .option-name {
            font-weight: 700;
            font-size: 1.2rem;

        }

        .option-sub {
            font-size: 0.85rem;
            color: var(--text-sub);

        }

        /* Step Transitions */
        .step-container {
            display: none;
            animation: slideUpFade 0.5s ease;
        }
        .step-container.active {
            display: block;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Button */
        .btn-back {
            background: none;
            border: none;
            color: var(--text-sub);

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ko',
                includedLanguages: 'ko,en,zh-CN,ja,vi,ru'
            }, 'google_translate_element');
        }

        document.addEventListener('DOMContentLoaded', function() {
            var customSelect = document.getElementById('custom_lang_select');
            if (!customSelect) return;
            
            // Initial load cookie check
            var match = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
            if (match) {
                var lang = match[1].split('/').pop();
                if (lang && lang !== 'ko') {
                    customSelect.value = lang;
                }
            } else {
                customSelect.value = 'ko';
            }

            customSelect.addEventListener('change', function() {
                var targetLang = this.value;
                
                if (targetLang === 'ko') {
                    // Force cookie clear and reload to perfectly restore original Korean DOM
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + window.location.hostname + '; path=/;';
                    window.location.reload();
                    return;
                }

                var gtSelect = document.querySelector('.goog-te-combo');
                if (gtSelect) {
                    gtSelect.value = targetLang;
                    gtSelect.dispatchEvent(new Event('change'));
                }
                
                document.cookie = 'googtrans=/ko/' + targetLang + '; path=/';
                document.cookie = 'googtrans=/ko/' + targetLang + '; domain=' + window.location.hostname + '; path=/';
                
                // Small delay to allow the Google Translate script to catch the change, else reload
                setTimeout(() => {
                    if(!document.querySelector('.goog-te-combo')) {
                        window.location.reload();
                    }
                }, 300);
            });
            
            // Mutation observer to force remove body top styling injected dynamically by google translate
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.attributeName === 'style') {
                        if (document.body.style.top) {
                            document.body.style.top = '';
                        }
                    }
                });
            });
            observer.observe(document.body, { attributes: true });
        });
    </script>
