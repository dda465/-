            </div>
        </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.currentTrackingDocId = null;

        window.notifyDispatch = (docId) => {
            window.currentTrackingDocId = docId;
            document.getElementById('tracking-courier').value = '';
            document.getElementById('tracking-number').value = '';
            document.getElementById('tracking-modal').style.display = 'flex';
        };

        window.submitTracking = async (bypass = false) => {
            if (!window.currentTrackingDocId) return;
            
            let courier = '미입력';
            let trackingNum = '미입력';
            
            if (!bypass) {
                courier = document.getElementById('tracking-courier').value;
                trackingNum = document.getElementById('tracking-number').value.trim();
                if (!courier || courier === '미입력') { alert("택배사를 선택해주세요."); return; }
                if (!trackingNum || trackingNum === '미입력') { alert("운송장 번호를 입력해주세요."); return; }
            } else {
                if (!confirm("송장번호 입력 없이 발송 완료 처리하시겠습니까?\n(추후 택배 발송 여부만 확인됩니다)")) return;
            }
            
            try {
                const docRef = doc(db, "quotes", window.currentTrackingDocId);
                await updateDoc(docRef, {
                    status: '수거중',
                    trackingCarrier: courier,
                    trackingNumber: trackingNum,
                    trackingSubmittedAt: serverTimestamp()
                });
                
                alert("택배 발송 정보가 등록되었습니다!");
                document.getElementById('tracking-modal').style.display = 'none';
                window.location.reload();
                
            } catch(e) {
                console.error(e);
                alert("처리 중 오류가 발생했습니다.");
            }
        };
    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ko',
                includedLanguages: 'ko,en,zh-CN,ja,vi,ru'
            }, 'google_translate_element');
        }

        document.addEventListener('DOMContentLoaded', function() {
            var customSelect = document.getElementById('custom_lang_select');
            if (!customSelect) return;
            
            // Initial load cookie check
            var match = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
            if (match) {
                var lang = match[1].split('/').pop();
                if (lang && lang !== 'ko') {
                    customSelect.value = lang;
                }
            } else {
                customSelect.value = 'ko';
            }

            customSelect.addEventListener('change', function() {
                var targetLang = this.value;
                
                if (targetLang === 'ko') {
                    // Force cookie clear and reload to perfectly restore original Korean DOM
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + window.location.hostname + '; path=/;';
                    window.location.reload();
                    return;
                }

                var gtSelect = document.querySelector('.goog-te-combo');
                if (gtSelect) {
                    gtSelect.value = targetLang;
                    gtSelect.dispatchEvent(new Event('change'));
                }
                
                document.cookie = 'googtrans=/ko/' + targetLang + '; path=/';
                document.cookie = 'googtrans=/ko/' + targetLang + '; domain=' + window.location.hostname + '; path=/';
                
                // Small delay to allow the Google Translate script to catch the change, else reload
                setTimeout(() => {
                    if(!document.querySelector('.goog-te-combo')) {
                        window.location.reload();
                    }
                }, 300);
            });
            
            // Mutation observer to force remove body top styling injected dynamically by google translate
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.attributeName === 'style') {
                        if (document.body.style.top) {
                            document.body.style.top = '';
                        }
                    }
                });
            });
            observer.observe(document.body, { attributes: true });
        });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
