                deviceModel: "Z플립 5", deviceStorage: "512GB", transactionPrice: "65만원", userName: "황보*", rating: 5, dateStr: "2025-01-20"
            }
        ];

        async function seed() {
            const statusDiv = document.getElementById('status');
            for (let i = 0; i < reviews.length; i++) {
                const r = reviews[i];
                const dateObj = new Date(r.dateStr);
                // Add some random time to the date so they aren't all at midnight
                dateObj.setHours(Math.floor(Math.random() * 8) + 9); // between 9 AM and 5 PM
                dateObj.setMinutes(Math.floor(Math.random() * 60));

                const docData = {
                    deviceModel: r.deviceModel,
                    deviceStorage: r.deviceStorage,
                    transactionPrice: r.transactionPrice,
                    rating: r.rating,
                    text: r.text,
                    userId: "system_generated",
                    userEmail: "",
                    userName: r.userName,
                    createdAt: Timestamp.fromDate(dateObj),
                    updatedAt: Timestamp.fromDate(dateObj),
                    imageUrl: null
                };

                try {
                    await addDoc(collection(db, "reviews"), docData);
                    statusDiv.innerHTML += `<p>Added Review ${i + 1}/${reviews.length}</p>`;
                } catch (e) {
                    statusDiv.innerHTML += `<p style="color:red">Error on ${i + 1}: ${e.message}</p>`;
                }
            }
            statusDiv.innerHTML += `<p style="color:green; font-weight:bold;">DONE!</p>`;
        }

        seed();
    </script>
