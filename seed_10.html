        async function seed() {
            const statusDiv = document.getElementById('status');
            for (let i = 0; i < newReviews.length; i++) {
                const r = newReviews[i];
                const dateObj = new Date(r.dateStr);
                // Add some random time between 9 AM and 5 PM
                dateObj.setHours(Math.floor(Math.random() * 8) + 9);
                dateObj.setMinutes(Math.floor(Math.random() * 60));

                const docData = {
                    deviceModel: r.deviceModel,
                    deviceStorage: r.deviceStorage,
                    transactionPrice: r.transactionPrice,
                    rating: r.rating,
                    text: r.text,
                    userId: "system_generated",
                    userEmail: "",
                    userName: r.userName,
                    createdAt: Timestamp.fromDate(dateObj),
                    updatedAt: Timestamp.fromDate(dateObj),
                    imageUrl: null
                };

                try {
                    await addDoc(collection(db, "reviews"), docData);
                    statusDiv.innerHTML += `<p>Added Review ${i + 1}/${newReviews.length}</p>`;
                } catch (e) {
                    statusDiv.innerHTML += `<p style="color:red">Error on ${i + 1}: ${e.message}</p>`;

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ko',
                includedLanguages: 'ko,en,zh-CN,ja,vi,ru'
            }, 'google_translate_element');
        }

        document.addEventListener('DOMContentLoaded', function() {
            var customSelect = document.getElementById('custom_lang_select');
            if (!customSelect) return;
            
            // Initial load cookie check
            var match = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
            if (match) {
                var lang = match[1].split('/').pop();
                if (lang && lang !== 'ko') {
                    customSelect.value = lang;
                }
            } else {
                customSelect.value = 'ko';
            }

            customSelect.addEventListener('change', function() {
                var targetLang = this.value;
                
                if (targetLang === 'ko') {
                    // Force cookie clear and reload to perfectly restore original Korean DOM
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + window.location.hostname + '; path=/;';
                    window.location.reload();
                    return;
                }

                var gtSelect = document.querySelector('.goog-te-combo');
                if (gtSelect) {
                    gtSelect.value = targetLang;
                    gtSelect.dispatchEvent(new Event('change'));
                }
                
                document.cookie = 'googtrans=/ko/' + targetLang + '; path=/';
                document.cookie = 'googtrans=/ko/' + targetLang + '; domain=' + window.location.hostname + '; path=/';
                
                // Small delay to allow the Google Translate script to catch the change, else reload
                setTimeout(() => {
                    if(!document.querySelector('.goog-te-combo')) {
                        window.location.reload();
                    }
                }, 300);
            });
            
            // Mutation observer to force remove body top styling injected dynamically by google translate
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.attributeName === 'style') {
                        if (document.body.style.top) {
                            document.body.style.top = '';
                        }
                    }
                });
            });
            observer.observe(document.body, { attributes: true });
        });
    </script>
