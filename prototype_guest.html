        }

            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {

        #result-area {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px dashed #d2d2d7;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-card {
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 24px;
            background: #fafafa;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .qc-info h3 {
            font-size: 1.15rem;
            margin: 0 0 6px 0;
            color: #1d1d1f;
            font-weight: 700;
        }

        .qc-info p {
            color: #86868b;
            font-size: 0.9rem;
            margin: 0 0 4px 0;
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            background: #E3F2FD;
            color: #1976D2;
        }

        .stepper-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eaeaea;
        }

        .stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #eee;
            z-index: 1;
        }

        .step {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }

        .step-icon {
            width: 32px;
            height: 32px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #ccc;
            font-weight: bold;
            transition: all 0.3s;
        }

        .step-text {
            font-size: 0.75rem;
            color: #999;
            font-weight: 600;
        }

        .step.active .step-icon, .step.completed .step-icon {
            border-color: #2563EB;
            color: #2563EB;
        }

            background: #2563EB;
            color: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

            color: #2563EB;
            font-weight: 700;

        </div>

        <div id="result-area">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">

                <button onclick="document.getElementById('result-area').style.display='none'" style="background:none; border:none; color:#86868b; cursor:pointer; font-size:0.9rem; text-decoration:underline;">다시 검색</button>
            </div>

            <div class="quote-card">
                <div class="qc-info">
                    <h3>아이폰 15 Pro (256GB)</h3>
                    <p>예상 매입가: <span style="color: #2563EB; font-weight: 700;">850,000원</span></p>
                    <p style="font-size: 0.8rem; margin-top: 6px;">신청일: 2026.05.13</p>
                </div>
                <div class="status-badge">접수 완료</div>
            </div>

            <div class="stepper-container">
                <div class="stepper">
                    <div class="step active">
                        <div class="step-icon">✓</div>
                        <div class="step-text">접수완료</div>
                    </div>
                    <div class="step">
                        <div class="step-icon">2</div>
                        <div class="step-text">검수중</div>
                    </div>
                    <div class="step">
                        <div class="step-icon">3</div>
                        <div class="step-text">검수완료</div>
                    </div>
                    <div class="step">
                        <div class="step-icon">4</div>
                        <div class="step-text">입금완료</div>
                    </div>
                </div>

                기기가 도착하면 검수 후 카카오톡 알림톡(또는 문자)으로 최종 견적을 안내해 드립니다.
            </div>
        </div>

        <a href="login.html" class="back-link">로그인 화면으로 돌아가기</a>
    </div>

    <script>
        function showMockResult() {
            const name = document.getElementById('g-name').value.trim();
            const phone = document.getElementById('g-phone').value.trim();

                return;
            }
            
            document.getElementById('result-area').style.display = 'block';
        }

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ko',
                includedLanguages: 'ko,en,zh-CN,ja,vi,ru'
            }, 'google_translate_element');
        }

        document.addEventListener('DOMContentLoaded', function() {
            var customSelect = document.getElementById('custom_lang_select');
            if (!customSelect) return;
            
            // Initial load cookie check
            var match = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
            if (match) {
                var lang = match[1].split('/').pop();
                if (lang && lang !== 'ko') {
                    customSelect.value = lang;
                }
            } else {
                customSelect.value = 'ko';
            }

            customSelect.addEventListener('change', function() {
                var targetLang = this.value;
                
                if (targetLang === 'ko') {
                    // Force cookie clear and reload to perfectly restore original Korean DOM
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + window.location.hostname + '; path=/;';
                    window.location.reload();
                    return;
                }

                var gtSelect = document.querySelector('.goog-te-combo');
                if (gtSelect) {
                    gtSelect.value = targetLang;
                    gtSelect.dispatchEvent(new Event('change'));
                }
                
                document.cookie = 'googtrans=/ko/' + targetLang + '; path=/';
                document.cookie = 'googtrans=/ko/' + targetLang + '; domain=' + window.location.hostname + '; path=/';
                
                // Small delay to allow the Google Translate script to catch the change, else reload
                setTimeout(() => {
                    if(!document.querySelector('.goog-te-combo')) {
                        window.location.reload();
                    }
                }, 300);
            });
            
            // Mutation observer to force remove body top styling injected dynamically by google translate
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.attributeName === 'style') {
                        if (document.body.style.top) {
                            document.body.style.top = '';
                        }
                    }
                });
            });
            observer.observe(document.body, { attributes: true });
        });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
